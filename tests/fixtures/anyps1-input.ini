[keyboard]
up=w
down=s
left=a
right=d
cross=j
circle=k
square=u
triangle=i
start=return

[controller]
cross=controller:south
circle=controller:east
square=controller:west
triangle=controller:north
select=controller:back
start=controller:start
up=controller:dpad_up
down=controller:dpad_down
left=controller:dpad_left
right=controller:dpad_right
left_x=controller_axis:leftx
left_y=controller_axis:lefty
right_x=controller_axis:rightx
right_y=controller_axis:righty

[mouse]
circle=mouse:left
